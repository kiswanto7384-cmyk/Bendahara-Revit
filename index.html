<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplikasi Bendahara Revitalisasi Sekolah</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="pg"></style>
<style>
:root{--bg:#f1f4f9;--sf:#fff;--tx:#14213d;--mu:#5b6578;--ln:#d3dae6;--pr:#12468f;--pr2:#e3ecfa;--gr:#2d6a3e;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--sf:#172035;--tx:#e8edf7;--mu:#98a3b8;--ln:#2b3753;--pr:#6ea2f0;--pr2:#1d2d4d;--gr:#7cc58f;--bad:#f2928a}}
:root[data-theme="dark"]{--bg:#0f1624;--sf:#172035;--tx:#e8edf7;--mu:#98a3b8;--ln:#2b3753;--pr:#6ea2f0;--pr2:#1d2d4d;--gr:#7cc58f;--bad:#f2928a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 'IBM Plex Sans',system-ui,Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 2px}.sub{color:var(--mu);margin:0 0 10px}
.chips,.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.chip{flex:0 0 auto;border:0;border-radius:99px;padding:7px 14px;background:var(--pr2);color:var(--pr);font:600 13px inherit;cursor:pointer}
.chip.on{background:var(--pr);color:var(--sf)}
.tab{flex:1 0 auto;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:6px;padding:9px 12px;font:600 13px inherit;cursor:pointer}
.tab.on{background:var(--pr);color:var(--sf);border-color:var(--pr)}
.tab.g.on{background:var(--gr);border-color:var(--gr)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
.st small{display:block;color:var(--mu)}.st b{font-size:15px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:12px;margin:10px 0}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
label.w{grid-column:1/-1}
input,select,textarea{font:14px inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:8px}
button{font-family:inherit}
.pri,.sec{border-radius:6px;padding:9px 14px;font:600 13px inherit;cursor:pointer;border:1px solid var(--pr)}
.pri{background:var(--pr);color:var(--sf)}.sec{background:transparent;color:var(--pr)}
.sm{font:600 12px inherit;border:1px solid var(--ln);background:var(--sf);color:var(--pr);border-radius:5px;padding:4px 8px;cursor:pointer}
.sm.d{color:var(--bad)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.scroll{overflow-x:auto}
table.l{width:100%;border-collapse:collapse}
table.l th,table.l td{border:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top}
table.l th{background:var(--pr2)}
.r{text-align:right!important;white-space:nowrap}
.empty{color:var(--mu);padding:14px;text-align:center}
.sheet{background:#fff;color:#000;border-radius:6px;padding:14px;overflow-x:auto}
.cb{width:30px;height:30px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:5px;font:700 14px inherit;cursor:pointer}.cb.pd{background:var(--pr2);color:var(--pr);border-color:var(--pr)}
.doc .t.sm th,.doc .t.sm td{padding:2px 1px;font-size:8px;text-align:center}.doc .t.sm td.nm{text-align:left;padding-left:3px;white-space:nowrap}
#pa{display:none}
.doc{color:#000;background:#fff;font:11px/1.4 'IBM Plex Sans',Arial,sans-serif}
.doc h2{text-align:center;margin:0;font-size:15px;letter-spacing:.3px}
.doc .c{text-align:center;margin:2px 0 8px}
.doc table{width:100%;border-collapse:collapse}
.doc .idt td{border:0;padding:1px 4px}
.doc .t th,.doc .t td{border:1px solid #000;padding:4px 6px;vertical-align:top;text-align:left}
.doc .t th{background:#e8e8e8;text-align:center}
.doc .t .r{text-align:right}
.doc .t tr.sum td{font-weight:700;background:#f3f3f3}
.doc .ttd{display:flex;justify-content:space-around;gap:10px;margin-top:22px;text-align:center;break-inside:avoid}
.doc .ttd div{flex:1}.doc .ttd .sp{height:58px}
.doc .kop{border-bottom:3px double #000;padding-bottom:6px;margin-bottom:10px;text-align:center}
.doc .kop b{font-size:14px;display:block}
.doc .nt{font-size:12px}
.doc .nt h2{font-size:17px;margin:6px 0}
.doc .box{border:1px solid #000;padding:6px 8px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:92vw;padding:11px 18px;border-radius:8px;background:var(--tx);color:var(--bg);font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:50;display:none;text-align:center}#toast.err{background:var(--bad);color:var(--sf)}
@media print{#toast{display:none!important}#app{display:none!important}#pa{display:block!important}body{background:#fff}:root{padding:0}}
@media (max-width:600px){.wrap{padding:8px}}
</style></head>
<body>
<div id="app" class="wrap">
  <h1>Aplikasi Bendahara Revitalisasi Satuan Pendidikan</h1>
  <p class="sub" id="ident"></p><p class="sub" id="sy" style="margin-top:-6px"></p>
  <div class="chips" id="mon"></div>
  <div class="tabs" id="tabs"></div>
  <div class="stats" id="stats"></div>
  <div id="view"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="pa"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>Math.round(n).toLocaleString('id-ID');
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const JN={terima:'Penerimaan dana bantuan',tarik:'Tarik tunai dari bank',setor:'Setor tunai ke bank',belanja:'Belanja',setorpajak:'Setor pajak',bunga:'Jasa giro / bunga bank',admin:'Biaya admin / pajak bunga bank'};
const NM={bku:'BUKU KAS UMUM',bpk:'BUKU PEMBANTU KAS TUNAI',bank:'BUKU BANK',pajak:'BUKU PEMBANTU PAJAK'};
const KEY='bendahara-p2sp-v1';
const DEF={id:{sekolah:'SDN 165 Tanjung Jabung Barat',npsn:'10501916',kab:'Tanjung Jabung Barat',kota:'',tahun:2026,pagu:371796163,kepsek:'',nipk:'',bend:'',nipb:'',ketua:'',keg:'Persiapan dan perizinan | 0\nBahan bangunan | 0\nUpah tenaga kerja | 0\nPerabot dan peralatan | 0\nBiaya lain-lain | 0'},tx:[],ba:{},pk:[],ab:{},pd:{}};
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.tx&&j.id)return fix(j)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()}
function fix(j){j.id=Object.assign({},DEF.id,j.id);j.ba=j.ba||{};j.pk=j.pk||[];j.ab=j.ab||{};j.pd=j.pd||{};return j}
let abMode='minggu',abWeek='',editW=null,payD='';
let lastId=null,S=load(),mon=new Date().getMonth(),tab='tx',editId=null,arm=null;

/* ---------- pembukuan ---------- */
function rows(){
  const r=[];
  S.tx.forEach(t=>{
    const j=+t.jumlah||0,v=t.via==='bank'?'n':'k';
    const b={d:t.tgl,no:t.no||t.spno,t:t.id,k:0,n:0,p:0,bi:0,bo:0,pj:'',u:(t.siplah?'[SIPLah] ':'')+t.uraian};
    const add=o=>r.push(Object.assign({},b,o));
    if(t.jenis==='terima')add({n:j,bi:j});
    else if(t.jenis==='tarik')add({n:-j,k:j});
    else if(t.jenis==='setor')add({k:-j,n:j});
    else if(t.jenis==='bunga')add({n:j,bi:j});
    else if(t.jenis==='admin')add({n:-j,bo:j});
    else if(t.jenis==='belanja'){
      add({[v]:-j,bo:j});
      [['PPN',t.ppn,'PPN'],['PPh',t.pph,t.jpph||'PPh 22']].forEach(x=>{const a=+x[1]||0;if(a)add({u:'Pungut '+x[0]+' – '+t.uraian,[v]:a,p:a,bi:a,pj:x[2]})});
    }
    else if(t.jenis==='setorpajak')add({[v]:-j,p:-j,bo:j,pj:t.pj,u:t.uraian+(t.ntpn?' (NTPN '+t.ntpn+')':'')});
  });
  return r.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.t-b.t);
}
const F={bku:r=>r.bi-r.bo,bpk:r=>r.k,bank:r=>r.n,pajak:r=>r.p};
const mkey=()=>S.id.tahun+'-'+String(mon+1).padStart(2,'0');
const fd=d=>d?d.split('-').reverse().join('/'):'';
function ledger(m){
  const key=mkey(),f=F[m],all=rows();
  let s=all.filter(r=>r.d.slice(0,7)<key).reduce((a,r)=>a+f(r),0);
  const open=s,cur=all.filter(r=>r.d.slice(0,7)===key&&f(r)!==0);
  let ti=0,to=0;
  const pj=m==='pajak';
  const head=['Tanggal','No. bukti','Uraian'].concat(pj?['Jenis pajak','Dipungut','Disetor']:['Penerimaan','Pengeluaran'],['Saldo']);
  const col=head.length;
  let body=`<tr><td></td><td></td><td colspan="${col-4}"><i>Saldo bulan lalu</i></td><td></td><td class="r"><b>${rp(open)}</b></td></tr>`;
  if(!pj)body=`<tr><td></td><td></td><td><i>Saldo bulan lalu</i></td><td></td><td></td><td class="r"><b>${rp(open)}</b></td></tr>`;
  else body=`<tr><td></td><td></td><td><i>Saldo bulan lalu</i></td><td></td><td></td><td></td><td class="r"><b>${rp(open)}</b></td></tr>`;
  cur.forEach(r=>{
    const x=f(r),i=x>0?x:0,o=x<0?-x:0;ti+=i;to+=o;s+=x;
    body+=`<tr><td>${fd(r.d)}</td><td>${esc(r.no)}</td><td>${esc(r.u)}</td>${pj?`<td>${esc(r.pj)}</td>`:''}<td class="r">${i?rp(i):''}</td><td class="r">${o?rp(o):''}</td><td class="r">${rp(s)}</td></tr>`;
  });
  const sp=pj?4:3;
  body+=`<tr class="sum"><td colspan="${sp}" style="text-align:right">Jumlah bulan ini</td><td class="r">${rp(ti)}</td><td class="r">${rp(to)}</td><td class="r">${rp(s)}</td></tr>`;
  let extra='';
  const upto=all.filter(r=>r.d.slice(0,7)<=key);
  const sum=k=>upto.reduce((a,r)=>a+r[k],0);
  if(m==='bku')extra=`<p style="margin:8px 0 2px"><b>Rincian saldo akhir bulan:</b></p><table class="idt"><tr><td>Kas tunai (BP Kas)</td><td>: Rp ${rp(sum('k'))}</td></tr><tr><td>Saldo bank (Buku Bank)</td><td>: Rp ${rp(sum('n'))}</td></tr><tr><td>Jumlah saldo BKU</td><td>: <b>Rp ${rp(sum('k')+sum('n'))}</b></td></tr><tr><td>Termasuk pajak belum disetor</td><td>: Rp ${rp(sum('p'))}</td></tr></table>`;
  if(pj){
    const g={};upto.filter(r=>r.p).forEach(r=>{const k=r.pj||'-';g[k]=g[k]||{i:0,o:0};r.p>0?g[k].i+=r.p:g[k].o-=r.p});
    extra=`<p style="margin:8px 0 2px"><b>Rekapitulasi sampai akhir bulan:</b></p><table class="t"><tr><th>Jenis pajak</th><th>Dipungut</th><th>Disetor</th><th>Belum disetor</th></tr>${Object.keys(g).map(k=>`<tr><td>${esc(k)}</td><td class="r">${rp(g[k].i)}</td><td class="r">${rp(g[k].o)}</td><td class="r">${rp(g[k].i-g[k].o)}</td></tr>`).join('')||'<tr><td colspan="4">Belum ada transaksi pajak</td></tr>'}</table>`;
  }
  return `<div class="doc"><h2>${NM[m]}</h2><p class="c">Bantuan Pemerintah Program Revitalisasi Satuan Pendidikan · Tahun Anggaran ${S.id.tahun}</p>
  <table class="idt"><tr><td width="130">Satuan pendidikan</td><td>: ${esc(S.id.sekolah)}</td></tr><tr><td>NPSN</td><td>: ${esc(S.id.npsn)}</td></tr><tr><td>Kabupaten/Kota</td><td>: ${esc(S.id.kab)}</td></tr><tr><td>Bulan</td><td>: ${BLN[mon]} ${S.id.tahun}</td></tr></table>
  <table class="t" style="margin-top:8px"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>${extra}${ttd()}</div>`;
}
function ttd(extra){
  const i=S.id,k=i.kota||'……………………';
  return `<div class="ttd">${extra||''}<div>Mengetahui,<br>Kepala Sekolah<div class="sp"></div><b><u>${esc(i.kepsek)||'……………………'}</u></b><br>NIP. ${esc(i.nipk)||'…………………'}</div><div>${esc(k)}, ……………… ${S.id.tahun}<br>Bendahara<div class="sp"></div><b><u>${esc(i.bend)||'……………………'}</u></b><br>NIP. ${esc(i.nipb)||'…………………'}</div></div>`;
}
/* ---------- nota ---------- */
const sat=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function tb(n){n=Math.floor(n);if(n<12)return sat[n];if(n<20)return tb(n-10)+' belas';if(n<100)return tb(Math.floor(n/10))+' puluh'+(n%10?' '+tb(n%10):'');if(n<200)return 'seratus'+(n%100?' '+tb(n%100):'');if(n<1000)return tb(Math.floor(n/100))+' ratus'+(n%100?' '+tb(n%100):'');if(n<2000)return 'seribu'+(n%1000?' '+tb(n%1000):'');if(n<1e6)return tb(Math.floor(n/1e3))+' ribu'+(n%1000?' '+tb(n%1000):'');if(n<1e9)return tb(Math.floor(n/1e6))+' juta'+(n%1e6?' '+tb(n%1e6):'');if(n<1e12)return tb(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+tb(n%1e9):'');return tb(Math.floor(n/1e12))+' triliun'+(n%1e12?' '+tb(n%1e12):'')}
const terbilang=n=>n<1?'nol rupiah':tb(n).trim()+' rupiah';
function items(s){return String(s||'').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]).map(a=>{const q=parseFloat(a[1])||1,h=parseFloat(a[3])||0;return{n:a[0],q,s:a[2]||'',h,j:q*h}})}
function notaSp(t){
  const it=items(t.items),tot=+t.jumlah||0,ok=+t.ongkir||0,i=S.id;
  const base=it.reduce((a,x)=>a+x.j,0)>0?it:[{n:t.uraian,q:1,s:'paket',h:tot-ok,j:tot-ok}];
  return `<div class="doc nt"><div class="kop"><b>${esc(i.sekolah.toUpperCase())}</b>NPSN ${esc(i.npsn)} · Kabupaten/Kota ${esc(i.kab)}<br>Panitia Pembangunan Satuan Pendidikan (P2SP) · Program Revitalisasi Satuan Pendidikan TA ${i.tahun}</div>
  <h2>BUKTI PEMBAYARAN BELANJA VIA SIPLAH</h2>
  <table class="idt"><tr><td width="150">No. bukti</td><td>: ${esc(t.no)||'-'}</td><td width="90">Tanggal</td><td>: ${fd(t.tgl)}</td></tr><tr><td>No. pesanan / invoice</td><td colspan="3">: ${esc(t.spno)||'…………………………'}</td></tr><tr><td>Mitra SIPLah</td><td colspan="3">: ${esc(t.spmitra)||'…………………………'}</td></tr><tr><td>Penyedia</td><td colspan="3">: ${esc(t.penyedia)||'…………………………'}</td></tr><tr><td>Keperluan</td><td colspan="3">: ${esc(t.uraian)}</td></tr></table>
  <table class="t" style="margin-top:8px"><tr><th width="28">No</th><th>Nama barang / jasa</th><th>Jumlah</th><th>Satuan</th><th>Harga satuan (Rp)</th><th>Jumlah (Rp)</th></tr>
  ${base.map((x,k)=>`<tr><td class="r">${k+1}</td><td>${esc(x.n)}</td><td class="r">${x.q}</td><td>${esc(x.s)}</td><td class="r">${rp(x.h)}</td><td class="r">${rp(x.j)}</td></tr>`).join('')}
  ${ok?`<tr><td colspan="5" class="r">Biaya kirim / admin</td><td class="r">${rp(ok)}</td></tr>`:''}
  <tr class="sum"><td colspan="5" class="r">Total dibayar sesuai invoice</td><td class="r">${rp(tot)}</td></tr></table>
  <div class="box"><b>Terbilang:</b> <i>${esc(terbilang(tot))}</i></div>
  <p>Pembayaran dilakukan melalui transfer bank sesuai invoice SIPLah. Pajak telah diperhitungkan dalam invoice dan dipungut oleh mitra SIPLah.</p>
  <p><b>Lampiran:</b> (&nbsp;) Invoice SIPLah &nbsp; (&nbsp;) Bukti transfer bank &nbsp; (&nbsp;) Berita acara serah terima barang</p>
  <div class="ttd"><div>Bendahara<div class="sp"></div><b><u>${esc(i.bend)||'……………………'}</u></b><br>NIP. ${esc(i.nipb)||'…………………'}</div><div>Ketua P2SP<div class="sp"></div><b><u>${esc(i.ketua)||'……………………'}</u></b></div><div>Mengetahui,<br>Kepala Sekolah<div class="sp"></div><b><u>${esc(i.kepsek)||'……………………'}</u></b><br>NIP. ${esc(i.nipk)||'…………………'}</div></div></div>`;
}
function nota(t){
  if(t.siplah)return notaSp(t);
  const it=items(t.items),tot=+t.jumlah||0;
  const list=it.length&&it.reduce((a,x)=>a+x.j,0)>0?it:[{n:t.uraian,q:1,s:'paket',h:tot,j:tot}];
  const ppn=+t.ppn||0,pph=+t.pph||0,net=tot-ppn-pph;
  const i=S.id;
  return `<div class="doc nt"><div class="kop"><b>${esc(i.sekolah.toUpperCase())}</b>NPSN ${esc(i.npsn)} · Kabupaten/Kota ${esc(i.kab)}<br>Panitia Pembangunan Satuan Pendidikan (P2SP) · Program Revitalisasi Satuan Pendidikan TA ${i.tahun}</div>
  <h2>NOTA / KUITANSI PEMBELIAN</h2>
  <table class="idt"><tr><td width="120">No. bukti</td><td>: ${esc(t.no)||'-'}</td><td width="90">Tanggal</td><td>: ${fd(t.tgl)}</td></tr><tr><td>Dibeli dari</td><td colspan="3">: ${esc(t.penyedia)||'…………………………'}</td></tr><tr><td>Alamat</td><td colspan="3">: ${esc(t.alamat)||'…………………………'}</td></tr><tr><td>Keperluan</td><td colspan="3">: ${esc(t.uraian)}</td></tr></table>
  <table class="t" style="margin-top:8px"><tr><th width="28">No</th><th>Nama barang / jasa</th><th>Jumlah</th><th>Satuan</th><th>Harga satuan (Rp)</th><th>Jumlah (Rp)</th></tr>
  ${list.map((x,k)=>`<tr><td class="r">${k+1}</td><td>${esc(x.n)}</td><td class="r">${x.q}</td><td>${esc(x.s)}</td><td class="r">${rp(x.h)}</td><td class="r">${rp(x.j)}</td></tr>`).join('')}
  <tr class="sum"><td colspan="5" class="r">Total</td><td class="r">${rp(tot)}</td></tr>
  ${ppn?`<tr><td colspan="5" class="r">Dipotong PPN (disetor bendahara)</td><td class="r">${rp(ppn)}</td></tr>`:''}
  ${pph?`<tr><td colspan="5" class="r">Dipotong ${esc(t.jpph||'PPh')} (disetor bendahara)</td><td class="r">${rp(pph)}</td></tr>`:''}
  ${ppn||pph?`<tr class="sum"><td colspan="5" class="r">Dibayarkan kepada penyedia</td><td class="r">${rp(net)}</td></tr>`:''}</table>
  <div class="box"><b>Terbilang:</b> <i>${esc(terbilang(tot))}</i></div>
  <p>Barang/jasa tersebut telah diterima dengan baik dan lengkap.</p>
  <div class="ttd"><div>Penyedia / penerima<div class="sp"></div><b><u>${esc(t.penyedia)||'……………………'}</u></b></div><div>Ketua P2SP<div class="sp"></div><b><u>${esc(i.ketua)||'……………………'}</u></b></div><div>Bendahara<div class="sp"></div><b><u>${esc(i.bend)||'……………………'}</u></b><br>NIP. ${esc(i.nipb)||'…………………'}</div><div>Mengetahui,<br>Kepala Sekolah<div class="sp"></div><b><u>${esc(i.kepsek)||'……………………'}</u></b><br>NIP. ${esc(i.nipk)||'…………………'}</div></div></div>`;
}
function pr(html,o){$('#pa').innerHTML=html;$('#pg').textContent='@page{size:A4 '+o+';margin:14mm}';setTimeout(()=>window.print(),60)}

/* ---------- Google Sheet ---------- */
const SK='bendahara-p2sp-sync';
let cfg={};try{cfg=JSON.parse(localStorage.getItem(SK))||{}}catch(e){}

async function pull(manual){

/* ---------- rekap upah harian (batas tidak dipotong PPh 21) ---------- */
const BM=4500000,BH=450000,BT=54000000,norm=s=>String(s||'').trim().toLowerCase();
function upahRows(key){
  const th=key.slice(0,4),m={};
  S.tx.filter(t=>t.jenis==='belanja'&&t.upah&&t.tgl.slice(0,4)===th&&t.tgl.slice(0,7)<=key).forEach(t=>{
    const k=norm(t.pekerja)||'(tanpa nama)',o=m[k]=m[k]||{n:t.pekerja||'(tanpa nama)',npwp:false,hari:0,bln:0,thn:0,mx:0},j=+t.jumlah||0;
    o.thn+=j;o.npwp=t.npwp==='ada';
    if(t.tgl.slice(0,7)===key){o.hari+=+t.hari||0;o.bln+=j;o.mx=Math.max(o.mx,+t.uph||0)}
  });
  return Object.values(m).filter(o=>o.bln>0).sort((a,b)=>a.n.localeCompare(b.n));
}
function stat(o){
  const nw=o.npwp?'':' (tanpa NPWP: tarif +20%)';
  if(o.mx>BH)return['bad','Upah per hari melebihi Rp450.000, konsultasikan pemotongan PPh 21'+nw];
  if(o.bln>BM)return['bad','Melewati batas bulanan Rp4.500.000, konsultasikan pemotongan PPh 21'+nw];
  if(o.thn>BT)return['bad','Melewati batas tahunan Rp54.000.000, konsultasikan pemotongan PPh 21'+nw];
  if(o.bln>=BM*0.8)return['warn','Mendekati batas, sisa Rp '+rp(BM-o.bln)+' bulan ini'];
  return['ok','Aman, tidak dipotong. Sisa batas bulan ini Rp '+rp(BM-o.bln)];
}
const SC={ok:'#1a6b34',warn:'#9a6700',bad:'#b3261e'};
function upv(){
  const f=$('#f'),e=$('#upv');if(!f||!e||!f.upah.checked)return;
  const nm=norm(f.pekerja.value),key=(f.tgl.value||'').slice(0,7),th=key.slice(0,4);let b=0,t=0;
  S.tx.filter(x=>x.jenis==='belanja'&&x.upah&&x.id!==editId&&norm(x.pekerja)===nm&&x.tgl.slice(0,4)===th&&x.tgl.slice(0,7)<=key).forEach(x=>{const j=+x.jumlah||0;t+=j;if(x.tgl.slice(0,7)===key)b+=j});
  const u=+f.uph.value||0,j=(+f.hari.value||0)*u;b+=j;t+=j;if(j>0)f.jumlah.value=j;
  const s=stat({mx:u,bln:b,thn:t,npwp:f.npwp.value==='ada'});
  e.textContent='Kumulatif bulan ini '+(f.pekerja.value||'pekerja')+': Rp '+rp(b)+' dari batas Rp '+rp(BM)+'. '+s[1];e.style.color=SC[s[0]];
}

function pad(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addD(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)}
function monday(s){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return dstr(d)}
function wkStart(){if(!abWeek)abWeek=monday(dstr(new Date()));return abWeek}
const WH=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
function absDates(){if(abMode==='minggu'){const a=wkStart();return[0,1,2,3,4,5,6].map(i=>addD(a,i))}const y=S.id.tahun,n=new Date(y,mon+1,0).getDate();return Array.from({length:n},(_,i)=>y+'-'+pad(mon+1)+'-'+pad(i+1))}
function wDays(id,a,b){let s=0;for(const k in S.ab){const p=k.split('|');if(p[0]===String(id)&&p[1]>=a&&p[1]<=b)s+=S.ab[k]}return s}
function absRows(ds){
  const key=abMode==='bulan'?mkey():addD(wkStart(),3).slice(0,7),th=key.slice(0,4);
  return S.pk.map(w=>{
    let hari=0,byr=0;ds.forEach(d=>{const v=S.ab[w.id+'|'+d]||0;hari+=v;if(v&&S.pd[w.id+'|'+d])byr+=v});
    const u=+w.upah||0,st=stat({mx:u,bln:wDays(w.id,key+'-01',key+'-31')*u,thn:wDays(w.id,th+'-01-01',th+'-12-31')*u,npwp:w.npwp==='ada'});
    return{w,hari,upah:hari*u,belum:(hari-byr)*u,st};
  });
}
function bayar(){
  const ds=absDates(),a=ds[0],b=ds[ds.length-1],wk=abMode==='minggu',tg=payD||(wk?addD(wkStart(),5):b);
  const kl=kegList().find(k=>/upah/i.test(k.n)),id0=Date.now();let n=0,tot=0;
  S.pk.forEach(w=>{
    const days=ds.filter(d=>S.ab[w.id+'|'+d]&&!S.pd[w.id+'|'+d]);
    const hari=days.reduce((s,d)=>s+S.ab[w.id+'|'+d],0);if(!hari)return;
    const u=+w.upah||0,j=Math.round(hari*u),id=id0+(n++);
    S.tx.push({id,jenis:'belanja',tgl:tg,no:'',uraian:'Upah '+(wk?'mingguan '+fd(a)+' s.d. '+fd(b):'bulanan '+BLN[mon]+' '+S.id.tahun)+' – '+w.nama,via:'kas',penyedia:w.nama,alamat:'',items:'Upah '+w.nama+' | '+hari+' | hari | '+u,jumlah:j,ppn:'',pph:'',jpph:'PPh 21',keg:kl?kl.n:'',upah:'1',pekerja:w.nama,hari,uph:u,npwp:w.npwp,siplah:''});
    days.forEach(d=>{S.pd[w.id+'|'+d]=id});tot+=j;
  });
  if(!n){toast('Tidak ada hari baru yang perlu dibayar.');return}
  save();R();
  const bad=upahRows(tg.slice(0,7)).some(o=>stat(o)[0]==='bad');
  toast('Dicatat '+n+' pembayaran upah, total Rp '+rp(tot)+'. Cek tab Transaksi untuk mencetak nota.'+(bad?' Ada pekerja melewati batas, lihat tab Rekap Upah.':''),bad);
}

  if(o.upah){o.siplah='';const hr=+o.hari||0,up=+o.uph||0;if(!hr||!up){alert('Isi jumlah hari kerja dan upah per hari.');return}o.jumlah=hr*up;o.items='Upah '+(o.pekerja||'')+' | '+hr+' | hari | '+up;if(!o.penyedia)o.penyedia=o.pekerja}
  o.siplah=o.jenis==='belanja'&&o.siplah?'1':'';
  if(o.siplah){
    const s=items(o.items).reduce((a,x)=>a+x.j,0);if(s>0)o.jumlah=s+(+o.ongkir||0);
    o.ppn='';o.pph='';
    if(o.via!=='bank'){o.via='bank';toast('Belanja SIPLah dicatat dibayar dari Bank.')}
  }
  o.jumlah=+o.jumlah||0;
  if(!o.jumlah){alert('Isi jumlah (Rp) atau rincian barang.');return}
  if(editId){const k=S.tx.findIndex(x=>x.id===editId);o.id=editId;S.tx[k]=o;editId=null}else{o.id=Date.now();S.tx.push(o)}
  if(o.tgl)mon=Math.max(0,Math.min(11,+o.tgl.slice(5,7)-1));
  lastId=o.jenis==='belanja'?o.id:null;
  save();R();
  toast(cfg.url?'Transaksi disimpan, mengirim ke Google Sheet…':'Transaksi disimpan di browser (Google Sheet belum terhubung)');
});
R();
